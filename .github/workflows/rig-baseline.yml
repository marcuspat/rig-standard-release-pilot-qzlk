{
  "name": "Rig repository baseline",
  "on": {
    "pull_request": {},
    "push": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "baseline": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify starter files",
          "run": "test -s README.md && test -s AGENTS.md && test -s .turbo-rig/repository-standard.json && python3 -m json.tool .turbo-rig/repository-standard.json >/dev/null"
        }
      ]
    }
  }
}
